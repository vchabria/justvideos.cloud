      property="og:description"
      content="We build custom AI + VFX pipelines in video, animation, generative cinematics and live-capture finish — for enterprises, brands and creators alike."

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      // Apply saved theme before React renders to prevent flash
      (function(){var t=localStorage.getItem('theme');if(t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('dark')})();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
